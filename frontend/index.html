<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northstar Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #0B1220;
    --navy-panel: #131C31;
    --navy-raised: #1B2740;
    --line: #26314A;
    --star: #E8B34D;
    --star-dim: #7A6236;
    --text: #F4F1EA;
    --text-dim: #8B93A7;
    --ok: #5FB88A;
    --err: #E4634F;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #17223B 0%, var(--navy-deep) 55%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:460px;
    height:min(760px, 92vh);
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  /* Header */
  .header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .star-mark{
    width:34px;height:34px;flex-shrink:0;position:relative;
  }
  .star-mark svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(232,179,77,0.55));}
  .star-mark::after{
    content:"";
    position:absolute; inset:-6px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,179,77,0.35), transparent 70%);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.5; transform:scale(0.9);}
    50%{opacity:1; transform:scale(1.15);}
  }
  .header-text{flex:1; min-width:0;}
  .header-text .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16.5px;
    letter-spacing:0.2px;
  }
  .header-text .sub{
    font-size:12px;
    color:var(--text-dim);
    margin-top:1px;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 3px rgba(95,184,138,0.15);
    flex-shrink:0;
  }
  .settings-toggle{
    background:none;border:none;color:var(--text-dim);
    font-size:16px; cursor:pointer; padding:4px; line-height:1;
    flex-shrink:0;
  }
  .settings-toggle:hover{color:var(--text);}

  .settings-panel{
    display:none;
    padding:12px 20px;
    border-bottom:1px solid var(--line);
    background:var(--navy-raised);
    flex-shrink:0;
  }
  .settings-panel.open{display:block;}
  .settings-panel label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); display:block; margin-bottom:6px;
  }
  .settings-panel input{
    width:100%;
    background:var(--navy-deep);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
  }
  .settings-panel input:focus{outline:1px solid var(--star); border-color:var(--star);}

  /* Thread */
  .thread{
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .thread::-webkit-scrollbar{width:6px;}
  .thread::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .row{display:flex; gap:8px; max-width:88%;}
  .row.user{align-self:flex-end; flex-direction:row-reverse;}
  .row.bot{align-self:flex-start;}

  .bubble{
    padding:10px 13px;
    border-radius:var(--radius);
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .row.bot .bubble{
    background:var(--navy-raised);
    border:1px solid var(--line);
    border-top-left-radius:4px;
  }
  .row.user .bubble{
    background:linear-gradient(135deg,#3A4A73,#2A3656);
    border-top-right-radius:4px;
  }
  .row.bot .bubble.fallback{
    border-color: var(--star-dim);
    color:var(--text-dim);
  }
  .row.bot .bubble.error{
    border-color: var(--err);
    color: #F3B7AC;
  }

  .quick-chips{
    display:flex; gap:8px; padding:0 16px 12px; flex-wrap:wrap; flex-shrink:0;
  }
  .chip{
    background:var(--navy-raised);
    border:1px solid var(--line);
    color:var(--text);
    font-size:12.5px;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .chip:hover{border-color:var(--star);}

  /* Order card */
  .order-card{
    margin-top:8px;
    background:var(--navy-deep);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    font-size:12.5px;
  }
  .order-card .oc-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 12px;
    border-bottom:1px solid var(--line);
    background:var(--navy-raised);
  }
  .order-card .oc-id{
    font-family:'IBM Plex Mono',monospace;
    color:var(--star);
    font-size:12px;
  }
  .oc-status{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:2px 8px;
    border-radius:999px;
    background:rgba(95,184,138,0.15);
    color:var(--ok);
  }
  .oc-status.returned, .oc-status.requested{
    background:rgba(232,179,77,0.15);
    color:var(--star);
  }
  .oc-body{padding:10px 12px; display:flex; flex-direction:column; gap:5px;}
  .oc-line{display:flex; justify-content:space-between; gap:10px; color:var(--text-dim);}
  .oc-line span:last-child{color:var(--text); text-align:right;}

  /* Typing indicator */
  .typing{
    display:flex; gap:4px; align-items:center; padding:12px 13px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  /* Composer */
  .composer{
    border-top:1px solid var(--line);
    padding:12px 14px;
    display:flex;
    gap:8px;
    flex-shrink:0;
    background:var(--navy-panel);
  }
  .composer input{
    flex:1;
    background:var(--navy-raised);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .composer input:focus{outline:none; border-color:var(--star);}
  .composer input::placeholder{color:var(--text-dim);}
  .composer button{
    width:42px; height:42px; flex-shrink:0;
    border-radius:10px;
    border:none;
    background:var(--star);
    color:var(--navy-deep);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:filter .15s;
  }
  .composer button:hover{filter:brightness(1.08);}
  .composer button:disabled{opacity:0.4; cursor:not-allowed;}

  @media (prefers-reduced-motion: reduce){
    .star-mark::after, .typing span{animation:none;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="star-mark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L14.2 9.2 L21.5 9.9 L15.8 14.6 L17.6 21.8 L12 17.6 L6.4 21.8 L8.2 14.6 L2.5 9.9 L9.8 9.2 Z" fill="#E8B34D"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="brand">Northstar Support</div>
      <div class="sub">Order status &amp; returns — usually replies in seconds</div>
    </div>
    <span class="status-dot" id="statusDot" title="Checking connection..."></span>
    <button class="settings-toggle" id="settingsToggle" title="Settings">⚙</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label for="apiBase">API base URL</label>
    <input id="apiBase" type="text" value="http://127.0.0.1:8000/api/v1" spellcheck="false">
  </div>

  <div class="thread" id="thread"></div>

  <div class="quick-chips">
    <button class="chip" data-msg="Where is my order 1001?">Track order 1001</button>
    <button class="chip" data-msg="I want to return my order 1002">Start a return</button>
    <button class="chip" data-msg="Can you recommend a product for me?">Ask something unsupported</button>
  </div>

  <form class="composer" id="composer">
    <input id="messageInput" type="text" placeholder="Ask about an order or return…" autocomplete="off">
    <button type="submit" id="sendBtn" aria-label="Send">➤</button>
  </form>
</div>

<script>
(function(){
  const thread = document.getElementById('thread');
  const composer = document.getElementById('composer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const apiBaseInput = document.getElementById('apiBase');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const statusDot = document.getElementById('statusDot');
  const chips = document.querySelectorAll('.chip');

  function apiBase(){
    return apiBaseInput.value.trim().replace(/\/$/, '');
  }

  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  // --- Rendering helpers ---
  function scrollToBottom(){
    thread.scrollTop = thread.scrollHeight;
  }

  function addBotText(text, variant){
    const row = document.createElement('div');
    row.className = 'row bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (variant ? ' ' + variant : '');
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addUserText(text){
    const row = document.createElement('div');
    row.className = 'row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    scrollToBottom();
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    thread.appendChild(row);
    scrollToBottom();
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function statusClass(status){
    const s = (status || '').toLowerCase();
    if(s === 'shipped' || s === 'delivered') return 'shipped';
    if(s === 'requested' || s === 'returned') return 'requested';
    return '';
  }

  function renderOrderCard(order){
    const wrap = document.createElement('div');
    wrap.className = 'order-card';

    const head = document.createElement('div');
    head.className = 'oc-head';
    head.innerHTML =
      '<span class="oc-id">#' + order.order_id + '</span>' +
      '<span class="oc-status ' + statusClass(order.status) + '">' + (order.status || 'unknown') + '</span>';
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'oc-body';

    function line(label, value){
      const l = document.createElement('div');
      l.className = 'oc-line';
      l.innerHTML = '<span>' + label + '</span><span></span>';
      l.querySelector('span:last-child').textContent = value;
      body.appendChild(l);
    }

    if(order.product) line('Product', order.product.name + ' × ' + order.quantity);
    if(order.expected_delivery) line('Expected delivery', order.expected_delivery);
    if(order.customer) line('Customer', order.customer.name);

    if(order.returns && order.returns.length){
      const r = order.returns[0];
      line('Return status', r.return_status);
      line('Refund status', r.refund_status + (r.refund_amount ? ' · $' + r.refund_amount : ''));
    }

    wrap.appendChild(body);

    const row = document.createElement('div');
    row.className = 'row bot';
    const holder = document.createElement('div');
    holder.style.maxWidth = '100%';
    holder.appendChild(wrap);
    row.appendChild(holder);
    thread.appendChild(row);
    scrollToBottom();
  }

  // --- Intent parsing (lightweight, mirrors backend fallback expectations) ---
  function extractOrderId(text){
    const match = text.match(/\b(\d{3,6})\b/);
    return match ? parseInt(match[1], 10) : null;
  }

  function looksSupported(text){
    const t = text.toLowerCase();
    return /order|return|refund|track|delivery|shipped|status/.test(t);
  }

  // --- API calls ---
  async function fetchOrder(orderId){
    const res = await fetch(apiBase() + '/orders/' + orderId + '/');
    const json = await res.json();
    if(!res.ok || json.status === 'error'){
      throw { notFound: true, message: json.message || 'Order not found.' };
    }
    return json.data;
  }

  async function postChat(message, orderId){
    const res = await fetch(apiBase() + '/chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message, order_id: orderId || null })
    });
    const json = await res.json();
    if(!res.ok || json.error){
      throw { serverError: true, message: json.error || 'Something went wrong on our end.' };
    }
    return json.reply;
  }

  async function checkConnection(){
    try{
      await fetch(apiBase() + '/orders/1001/');
      statusDot.style.background = 'var(--ok)';
      statusDot.title = 'Connected';
    }catch(e){
      statusDot.style.background = 'var(--err)';
      statusDot.title = 'Cannot reach API — check the base URL in settings';
    }
  }

  // --- Main send flow ---
  async function handleSend(text){
    if(!text.trim()) return;
    addUserText(text);
    messageInput.value = '';
    sendBtn.disabled = true;

    if(!looksSupported(text)){
      addTyping();
      setTimeout(() => {
        removeTyping();
        addBotText(
          "I can only help with order status and returns/refunds right now. Try asking things like \"Where's my order 1001?\" or \"I want to return order 1004.\"",
          'fallback'
        );
        sendBtn.disabled = false;
      }, 500);
      return;
    }

    const orderId = extractOrderId(text);
    addTyping();

    try{
      const reply = await postChat(text, orderId);
      removeTyping();
      addBotText(reply);

      if(orderId){
        try{
          const order = await fetchOrder(orderId);
          renderOrderCard(order);
        }catch(orderErr){
          // Chat already answered; order card is a bonus, so fail quietly here.
        }
      }
    }catch(err){
      removeTyping();
      if(err && err.notFound){
        addBotText("I couldn't find order " + orderId + ". Double check the order number and try again.", 'error');
      }else{
        addBotText(err && err.message ? err.message : "I'm having trouble reaching the support system. Please try again in a moment.", 'error');
      }
    }finally{
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    handleSend(messageInput.value);
  });

  chips.forEach(chip => {
    chip.addEventListener('click', () => handleSend(chip.dataset.msg));
  });

  // Greeting
  addBotText("Hi, I'm the Northstar support assistant. I can help with order status and returns/refunds — what do you need?");
  checkConnection();
})();
</script>

</body>
</html>
